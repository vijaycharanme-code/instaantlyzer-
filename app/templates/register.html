<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - InstaIntel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center font-sans">
    <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-md my-8">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-indigo-600">InstaIntel</h1>
            <p class="text-gray-500">Create a new account</p>
        </div>

        {% if error %}
        <div class="mb-4 p-3 bg-red-50 text-red-700 border border-red-200 rounded-lg text-sm text-center">
            {{ error }}
        </div>
        {% endif %}

        <form action="/auth/register" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Username</label>
                <input type="text" name="username" required class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" name="password" required class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">I am a...</label>
                <div class="flex gap-4">
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="role" value="user" checked class="peer sr-only">
                        <div class="p-3 text-center border rounded-lg peer-checked:border-indigo-600 peer-checked:bg-indigo-50 peer-checked:text-indigo-700 hover:bg-gray-50">
                            Regular User
                        </div>
                    </label>
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="role" value="creator" class="peer sr-only">
                        <div class="p-3 text-center border rounded-lg peer-checked:border-indigo-600 peer-checked:bg-indigo-50 peer-checked:text-indigo-700 hover:bg-gray-50">
                            Creator
                        </div>
                    </label>
                </div>
            </div>

            <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-2 rounded-lg hover:bg-indigo-700 transition mt-4">Register</button>
        </form>

        <p class="mt-6 text-center text-sm text-gray-600">
            Already have an account? <a href="/auth/login" class="text-indigo-600 font-medium hover:underline">Log in</a>
        </p>
    </div>
</body>
</html>
